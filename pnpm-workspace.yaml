packages: []

overrides:
  # Prisma's AJV range permits the patched release, but its lock currently
  # selects 3.1.3. Keep the transitive URL parser above both published fixes.
  fast-uri: 3.1.5

allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  '@swc/core': true
  better-sqlite3: true
  prisma: true
  protobufjs: true
  sharp: true

minimumReleaseAgeExclude:
  - '@next/env@16.3.0'
  - '@next/swc-darwin-arm64@16.3.0'
  - '@next/swc-darwin-x64@16.3.0'
  - '@next/swc-linux-arm64-gnu@16.3.0'
  - '@next/swc-linux-arm64-musl@16.3.0'
  - '@next/swc-linux-x64-gnu@16.3.0'
  - '@next/swc-linux-x64-musl@16.3.0'
  - '@next/swc-win32-arm64-msvc@16.3.0'
  - '@next/swc-win32-x64-msvc@16.3.0'
  - next@16.3.0

onlyBuiltDependencies:
  - protobufjs
  - sharp
