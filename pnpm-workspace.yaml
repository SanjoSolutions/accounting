packages: []

overrides:
  # Keep the transitive URL parser above the published normalization fixes.
  '@tootallnate/once@<2.0.1': ^2.0.1
  deepmerge-ts@<8.0.0: ^8.0.0
  fast-uri: 3.1.8
  mysql2@<3.22.0: ^3.22.0
  mysql2@<=3.23.0: ^3.23.1

allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  '@swc/core': true
  better-sqlite3: true
  prisma: true
  protobufjs: true
  sharp: true

minimumReleaseAgeExclude:
  - '@next/env@16.3.0'
  - '@next/swc-darwin-arm64@16.3.0'
  - '@next/swc-darwin-x64@16.3.0'
  - '@next/swc-linux-arm64-gnu@16.3.0'
  - '@next/swc-linux-arm64-musl@16.3.0'
  - '@next/swc-linux-x64-gnu@16.3.0'
  - '@next/swc-linux-x64-musl@16.3.0'
  - '@next/swc-win32-arm64-msvc@16.3.0'
  - '@next/swc-win32-x64-msvc@16.3.0'
  - next@16.3.0
  - '@tootallnate/once@2.0.1'
  - deepmerge-ts@8.0.0
  - mysql2@3.22.0 || 3.23.1
  - csv-parse@7.0.2
  - brace-expansion@2.1.5 || 2.1.6 || 2.1.7
  - '@grpc/grpc-js@1.14.5'
  - source-map-js@1.2.2

onlyBuiltDependencies:
  - protobufjs
  - sharp
